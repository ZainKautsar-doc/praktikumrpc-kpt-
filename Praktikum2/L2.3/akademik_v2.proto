syntax = "proto3";
package akademik;

service LayananNilai {
  rpc GetMahasiswa (MahasiswaRequest) returns (Mahasiswa);
}

message MahasiswaRequest { string nim = 1; }
message Mahasiswa {
  string nim = 1;
  string nama = 2;
  double ipk = 3;
  string prodi = 4; // Field baru untuk uji backward compatibility
}
